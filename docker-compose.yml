# ============================================================
# docker-compose.yml — Tekyrios AI Support
# Floci ya corre por separado (CLI). Este compose levanta
# LangFuse self-hosted para observabilidad local (opcional).
# ============================================================

services:
  # LangFuse self-hosted (observabilidad, alternativa a cloud)
  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-cache:
    image: redis:7-alpine
    volumes:
      - langfuse-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-server:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      REDIS_HOST: langfuse-cache
      REDIS_PORT: 6379
      NEXTAUTH_SECRET: mysecret
      SALT: mysalt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-cache:
        condition: service_healthy

volumes:
  langfuse-db-data:
  langfuse-cache-data:
